[env:xiaowow_esp32s3_serialhal]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = XiaoWow ESP32-S3 (SerialHal modem)
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

# Companion radio/modem for a native meshtasticd host (upstream PR #10351).
# The ESP32 does NOT run a mesh stack: HAS_SERIAL_HAL_DEVICE compiles in the
# device-side SPI/GPIO/interrupt proxy, and SERIAL_HAL_ONLY_DEFAULT makes it
# boot straight into proxy mode (skips radio init) so the host's SerialHal can
# drive the on-board E22/SX1262 over USB-CDC serial.
extends = esp32s3_base
board = seeed-xiao-s3
board_level = extra
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -D EBYTE_E22_900M30S
  -D HAS_SERIAL_HAL_DEVICE=1
  -D SERIAL_HAL_ONLY_DEFAULT
  -I variants/esp32s3/diy/xiaowow_esp32s3_serialhal
  -DBOARD_HAS_PSRAM
